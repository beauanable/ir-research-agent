# Run once manually to pull top 50 cited military AI papers since 2010
name: Foundational Military AI Paper Pull

on:
  workflow_dispatch:
    inputs:
      repair_paper_title:
        description: Optional exact title of an existing paper to repair
        type: string
        default: ''
      repair_pdf_url:
        description: PDF URL for that paper (required for repair)
        type: string
        default: ''

jobs:
  foundational-pull:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run foundational paper pull
        env:
          REPAIR_PAPER_TITLE: ${{ inputs.repair_paper_title }}
          REPAIR_PDF_URL: ${{ inputs.repair_pdf_url }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
        run: python -u foundational_pull.py
