# Run once manually to pull top 50 cited papers from top IR journals (2010-2025)
name: Foundational Paper Pull

on:
  workflow_dispatch:

jobs:
  foundational-pull:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run foundational paper pull
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
        run: python foundational_pull.py
