name: Run IR Research Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * 1'

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests openai pypdf

      - name: Run script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python main.py

      - name: Commit updated seen papers
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add seen_papers.json processed_papers.jsonl processed_chunks.jsonl

          git diff --cached --quiet || git commit -m "Update research database"

          git push
