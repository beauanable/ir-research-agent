# Runs every Monday at 15:00 UTC (8am Eastern / 7am Central)
name: Run Military AI Research Agent

on:
  workflow_dispatch:
    inputs:
      check_connections_only:
        description: Test service connections without collecting papers or sending email
        type: boolean
        default: false
  schedule:
    - cron: '0 15 * * 1'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate required secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PYEOF'
          import os, sys
          required = ["OPENAI_API_KEY", "EMAIL_ADDRESS", "EMAIL_PASSWORD", "SUPABASE_URL", "SUPABASE_SECRET_KEY"]
          missing = [v for v in required if not os.environ.get(v)]
          if missing:
              print(f"ERROR: Missing required secrets: {', '.join(missing)}")
              sys.exit(1)
          print("All required secrets present.")
          PYEOF

      - name: Check service connections
        if: ${{ inputs.check_connections_only == true }}
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python -u check_connections.py

      - name: Run research agent
        if: ${{ inputs.check_connections_only != true }}
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python main.py

      - name: Commit updated research database
        if: ${{ inputs.check_connections_only != true }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add seen_papers.json processed_papers.jsonl
          git diff --cached --quiet || (git commit -m "Update research database" && git push)
